[project]
name = "campus-ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "email-validator>=2.3.0",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    # Prometheus client: exposes aggregate request metrics at GET /metrics
    # (metrics.py). Optional at runtime (the app degrades to no-op metrics if
    # the package is missing) but declared here so real deploys can scrape it.
    "prometheus-client>=0.21.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    # Shared store for slowapi rate-limit counters + the app read-cache
    # (cache.py). Optional at runtime: with no REDIS_URL both degrade
    # gracefully, but the package must be installed for the Redis path.
    "redis>=5.2.0",
    # Redis-backed durable job queue for AI proof-scoring (jobs.py + worker.py).
    # Optional at runtime: with no REDIS_URL we fall back to in-process
    # BackgroundTasks, but the package must be installed for the queue path.
    "rq>=1.16",
    "sentry-sdk[fastapi]>=2.63.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    # Retry/backoff for outbound AI-worker calls (ai_client.py).
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]

[tool.ruff]
# Alembic migration scripts are autogenerated; their boilerplate imports
# (op, sa) aren't always used. Don't lint them.
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
