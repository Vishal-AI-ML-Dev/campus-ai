name: CI

on:
  push:
    branches: [main, feature/ai-mock-interview]
  pull_request:

# Read-only token; this workflow uses no repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      # SQLite, offline, AI calls stubbed. The real-Postgres suites
      # (tests_pg_api/, test_rls_postgres.py) are opt-in and skipped here.
      - name: Run tests
        run: uv run pytest
      # Phase 10.6: backup tooling (Storage backup/restore, retention) - offline.
      - name: Backup tooling tests
        run: uv run pytest ../scripts/backup -p no:cacheprovider --rootdir ../scripts/backup
      - name: Check observability modules are in sync
        working-directory: .
        run: python3 scripts/sync_observability.py --check

  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # Phase 10.4: unit tests and the production build (all feature flags at
      # their default OFF; no secrets, no API calls at build time).
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # Phase 10.4: the complete AI-worker suite, incl. the face tenant-filter tests
  # against a REAL (disposable, digest-pinned) Qdrant server. No provider keys:
  # every LLM call in these tests is stubbed.
  ai-worker:
    name: AI worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-worker
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://127.0.0.1:6333
      QDRANT_URL: http://127.0.0.1:6333
      FACE_COLLECTION: zz_test_faces_ci
      GROQ_API_KEY: ""
      GOOGLE_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fsS http://127.0.0.1:6333/readyz && break; sleep 2; done
      - name: Run tests
        run: uv run pytest -p no:cacheprovider

  # Phase 10.4: tenant isolation on REAL Postgres as the NOBYPASSRLS app_user
  # (RLS suites + tests_pg_api) and the Redis/RQ queue path. Disposable,
  # digest-pinned service containers; synthetic data; no repository secrets.
  backend-postgres:
    name: Backend Postgres RLS + API suites (+ Redis queue)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
        env:
          # Ephemeral CI container on the runner's loopback only; no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.22@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Migrate a fresh database to head and create the NOBYPASSRLS app role
        id: pg
        run: |
          app_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$app_pw"
          PG_DISPOSABLE=yes BACKEND_PYTHON="$PWD/.venv/bin/python" \
          OWNER_SQLALCHEMY_URL="postgresql+psycopg://postgres@127.0.0.1:5432/campus_rls_test" \
          APP_ROLE_PASSWORD="$app_pw" bash ../scripts/ci/pg_suite_setup.sh | tee "$RUNNER_TEMP/pg_setup.txt"
          echo "sysid=$(sed -n 's/^EXPECT_SYSID=//p' "$RUNNER_TEMP/pg_setup.txt")" >> "$GITHUB_OUTPUT"
          echo "url=postgresql+psycopg://app_user:${app_pw}@127.0.0.1:5432/campus_rls_test" >> "$GITHUB_OUTPUT"
      - name: Migration downgrade/upgrade round trip of the newest revision
        env:
          OWNER: postgresql+psycopg://postgres@127.0.0.1:5432/campus_rls_test
        run: |
          for step in "downgrade -1" "upgrade head"; do
            ENVIRONMENT=test SECRET_KEY="ci-throwaway-not-a-secret-0000000000" DATABASE_URL="$OWNER" \
            MIGRATION_DATABASE_URL="$OWNER" uv run alembic $step
          done
      - name: RLS suites (tests/*rls_postgres.py)
        env:
          RLS_TEST_DATABASE_URL: ${{ steps.pg.outputs.url }}
          EXPECT_SYSID: ${{ steps.pg.outputs.sysid }}
        run: uv run pytest tests/test_rls_postgres.py tests/test_mock_interview_rls_postgres.py tests/test_mock_interview_batch2_rls_postgres.py tests/test_mock_interview_coding_rls_postgres.py tests/test_placement_management_rls_postgres.py tests/test_placement_phase9_rls_postgres.py -p no:cacheprovider -rfEs
      - name: Postgres API suite (tests_pg_api) incl. Redis queue path
        env:
          RLS_TEST_DATABASE_URL: ${{ steps.pg.outputs.url }}
          EXPECT_SYSID: ${{ steps.pg.outputs.sysid }}
          RQ_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest tests_pg_api --confcutdir=tests_pg_api -p no:cacheprovider -o addopts="" -rfEs

  # Phase 10.2/10.4: production compose template policy (synthetic env only).
  compose-policy:
    name: Production compose policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the template with a synthetic env and check the policy
        run: |
          python3 deploy/make_synthetic_env.py "$RUNNER_TEMP/synthetic.env"
          docker compose -f deploy/compose.prod.yml --env-file "$RUNNER_TEMP/synthetic.env" \
            --profile migrate config --format json | python3 deploy/check_compose_prod.py

  # Phase 10.4: container images build (never pushed; no registry credentials).
  images:
    name: Container image builds (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend, ai-worker and frontend images
        run: |
          docker build -q -t campus-ci/backend:check backend
          docker build -q -t campus-ci/ai-worker:check ai-worker
          docker build -q -t campus-ci/frontend:check frontend

  # Phase 10.4: dependency vulnerability scans. REPORT-ONLY for now (the
  # findings are reviewed in Phase 10.10 before this job is made blocking).
  dependency-audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Python (backend, ai-worker) - pip-audit on the locked requirements
        run: |
          for svc in backend ai-worker; do
            (cd "$svc" && uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/$svc-req.txt")
            uvx pip-audit==2.9.0 --strict -r "$RUNNER_TEMP/$svc-req.txt" || echo "::warning::pip-audit findings in $svc"
          done
      - name: npm audit (frontend, production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit findings in frontend"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # Full history; findings are redacted in the log. Reviewed exceptions
      # live in .gitleaksignore as exact fingerprints.
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'

  # Phase 8.5b (P8-S6): the code-runner sandbox suite. Synthetic data only; no secrets; never production.
  # It runs only when runner/sandbox paths change (computed below, so the other jobs keep running on every push).
  sandbox-scope:
    name: Runner sandbox scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect runner changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then range="origin/${BASE_REF}...HEAD"; else range="${BEFORE_SHA}..HEAD"; fi
          # An unknown range (first push, force push) runs the suite rather than skipping it.
          files=$(git diff --name-only "$range" 2>/dev/null) || files="code-runner/"
          if printf '%s\n' "$files" | grep -Eq '^(code-runner/|backend/app/services/coding_bank\.py|backend/app/coding_bank/|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  sandbox:
    name: Runner sandbox security suite (gVisor, synthetic)
    needs: sandbox-scope
    if: needs.sandbox-scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: code-runner
    env:
      # Must equal code-runner/runner/pins.py (checked by tests/test_ci_pins.py).
      DOCKER_APT_KEY_FPR: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
      DOCKER_CE_VERSION: "5:29.9.3-1~ubuntu.24.04~noble"
      DOCKER_CE_SHA256: "c546181f0bc5f1d19085d764a3219aa86069468dbee4743fae420ee8a31809a4"
      DOCKER_CE_CLI_SHA256: "24f78a893cece8d345c4e90b5163907c047b996b747265f873743e8b0b0546d4"
      CONTAINERD_VERSION: "2.4.2-3~ubuntu.24.04~noble"
      CONTAINERD_SHA256: "f811ab57d1f4bb0cce19df7d526da8c711d8ebea0447cc83da1999188e664122"
      GVISOR_URL: "https://storage.googleapis.com/gvisor/releases/release/20261102.0/x86_64/gvisor.tar.bz2"
      GVISOR_SHA512: "2e6671bb2d033b871c5811ab57e16ac570988b0e0054c525f911cfaf191bab3ca4efb08e0a98daa4b9e7d248f9e5776ef2ef2f8a6b82d829646a42924c98bb05"
      RUNSC_SHA256: "c5a5a7ba1209b605d08874fdd4429035f95afcb2d482bc95ed3fb13d31a25098"
      SHIM_SHA256: "6187d6d34f4996e859353fbb4c56d5ed41fc35b5afa44bff766f4e4b424da5bb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Docker Engine (signing key and package checksums verified)
        run: |
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/docker.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/docker.asc" | grep -q "^fpr:::::::::${DOCKER_APT_KEY_FPR}:"
          sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/docker-pinned.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker-pinned.asc] https://download.docker.com/linux/ubuntu noble stable" \
            | sudo tee /etc/apt/sources.list.d/docker-pinned.list > /dev/null
          sudo apt-get update -q
          cd "$RUNNER_TEMP"
          apt-get download "docker-ce=${DOCKER_CE_VERSION}" "docker-ce-cli=${DOCKER_CE_VERSION}" "containerd.io=${CONTAINERD_VERSION}"
          echo "${DOCKER_CE_SHA256}  $(ls docker-ce_*.deb)" | sha256sum --check --strict
          echo "${DOCKER_CE_CLI_SHA256}  $(ls docker-ce-cli_*.deb)" | sha256sum --check --strict
          echo "${CONTAINERD_SHA256}  $(ls containerd.io_*.deb)" | sha256sum --check --strict
          sudo apt-get install -y --allow-downgrades ./docker-ce_*.deb ./docker-ce-cli_*.deb ./containerd.io_*.deb
      - name: Install pinned gVisor (archive SHA-512 and binary SHA-256 verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.bz2" "$GVISOR_URL"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum --check --strict
          tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$RUNNER_TEMP" runsc containerd-shim-runsc-v1
          echo "${RUNSC_SHA256}  $RUNNER_TEMP/runsc" | sha256sum --check --strict
          echo "${SHIM_SHA256}  $RUNNER_TEMP/containerd-shim-runsc-v1" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/runsc" "$RUNNER_TEMP/containerd-shim-runsc-v1" /usr/local/bin/
      - name: Register runsc (systrap platform, gVisor networking off) and restart Docker
        run: |
          current=/etc/docker/daemon.json
          [ -s "$current" ] || echo '{}' | sudo tee "$current" > /dev/null
          sudo jq '.runtimes.runsc = {"path": "/usr/local/bin/runsc", "runtimeArgs": ["--platform=systrap", "--network=none"]}' \
            "$current" | sudo tee "$RUNNER_TEMP/daemon.json" > /dev/null
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" "$current"
          sudo systemctl restart docker
          docker version --format 'docker {{.Server.Version}}'
          runsc --version | head -1
      - name: Pull digest-pinned toolchain images
        run: |
          for image in $(python3 -c "import runner.pins as p; print(' '.join(p.ALL_IMAGES))"); do docker pull -q "$image"; done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install dependencies (locked)
        run: uv sync --frozen
      # Diagnostic only: start ONE benign container (`sleep infinity`, no fixture, no user code) with the runner's own
      # hardened argv (container_argv + assert_hardened, --runtime=runsc) and print Docker's exit code and sanitized,
      # truncated stderr, which DockerCLI.create discards. Never gates the job; the escape suite still decides.
      - name: Diagnose sandbox container start (benign, gVisor runtime)
        continue-on-error: true
        run: |
          uv run python - <<'PY'
          import re, shutil, subprocess, time, uuid
          from runner.languages import BUILDER_UID, LANGUAGES
          from runner.sandbox import ContainerSpec, assert_hardened, container_argv

          def clean(raw):
              text = re.sub(r"[^\x20-\x7e]+", " ", raw.decode("utf-8", "replace")).strip()
              return text[:1500] or "(empty)"

          docker = shutil.which("docker") or "/usr/bin/docker"
          lang = LANGUAGES["python313"]
          name = f"cr-diag-{uuid.uuid4().hex[:12]}"
          # Same spec the executor builds for a compile step (runner/executor.py _new_container).
          spec = ContainerSpec(image=lang.image, memory_mb=lang.compile_memory_mb, pids=lang.pids,
                               nofile=max(lang.nofile, 256), cpu_rlimit_s=lang.compile_wall_s,
                               user=BUILDER_UID, name=name, created_epoch=int(time.time()))
          argv = container_argv(spec)
          assert_hardened(argv)
          print("diag argv flags:", " ".join(a for a in argv if a.startswith("--") and not a.startswith(("--name", "--label"))))
          try:
              p = subprocess.run([docker, *argv], capture_output=True, timeout=120, check=False)
              print(f"docker run exit={p.returncode} container_id_printed={bool(p.stdout.strip())}")
              print(f"docker run stderr: {clean(p.stderr)}")
              if p.returncode == 0:
                  s = subprocess.run([docker, "inspect", "--format", "{{.State.Status}} runtime={{.HostConfig.Runtime}}", name],
                                     capture_output=True, timeout=30, check=False)
                  print(f"container state: {clean(s.stdout)}")
          except (OSError, subprocess.SubprocessError) as exc:
              print(f"docker run did not complete: {type(exc).__name__}")
          finally:
              try:
                  subprocess.run([docker, "rm", "--force", name], capture_output=True, timeout=60, check=False)
              except (OSError, subprocess.SubprocessError) as exc:
                  print(f"cleanup did not complete: {type(exc).__name__}")
          PY
      - name: Runner unit, privacy and configuration tests
        run: uv run pytest -m "not gvisor"
      # Hostile synthetic fixtures run ONLY here, inside gVisor, after the runner's own self-check passes.
      - name: Escape / abuse / conformance suite (gVisor)
        env:
          RUNNER_GVISOR_E2E: "1"
        run: uv run pytest tests/escape -v
      # Diagnostic only, on failure: recent Docker/containerd daemon lines mentioning errors, warnings or runsc.
      # Synthetic CI host with no repository secrets; non-printable bytes stripped, lines truncated, output capped.
      - name: Docker daemon journal (on failure only)
        if: failure()
        continue-on-error: true
        run: |
          sudo journalctl -u docker -u containerd --since "-30 min" --no-pager -o short-iso 2>/dev/null \
            | grep -iE "error|fail|warn|runsc|gvisor|shim" \
            | sed -E 's/[^[:print:]\t]//g' | cut -c1-400 | tail -n 120 || true
